name: Fix visual exercise anchor
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/fix-visual-exercise-anchor.yml']
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'book/visual-perception-from-course-slides'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book/visual-perception-from-course-slides
      - name: Preserve the original exercise anchor and update internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          chapter=Path('chapters/06-visual-perception.md')
          text=chapter.read_text()
          text=text.replace('(66-exercises)=\n(vision-exercises)=\n','(66-exercises)=\n')
          assert '(66-exercises)=' in text and '(vision-exercises)=' not in text
          chapter.write_text(text)
          solutions=Path('chapters/solutions-embodied.md')
          text=solutions.read_text().replace('06-visual-perception.md#vision-exercises','06-visual-perception.md#66-exercises')
          solutions.write_text(text)
          test=Path('tests/check_visual_chapter.py')
          text=test.read_text().replace("'sensor-course-vision.png', 'vision-exercises', '66-exercises'", "'sensor-course-vision.png', '66-exercises'")
          text=text.replace("{'vision-pipeline','vision-exercises','66-exercises'}", "{'vision-pipeline','66-exercises'}")
          text=text.replace("assert 'Chapter 5' not in solutions", "assert 'Chapter 5' not in solutions\nassert '06-visual-perception.md#66-exercises' in solutions\nassert 'solutions-embodied.md#vision-solutions' in chapter")
          test.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters/06-visual-perception.md chapters/solutions-embodied.md tests/check_visual_chapter.py
          if ! git diff --cached --quiet; then
            git commit -m "Use the single stable exercise anchor and verify both directions of solution links"
            git push origin HEAD:book/visual-perception-from-course-slides
          fi
