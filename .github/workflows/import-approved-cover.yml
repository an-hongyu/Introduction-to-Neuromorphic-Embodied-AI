name: Import author-approved cover
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-cover.yml'
permissions:
  contents: write
jobs:
  import-cover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'book/approved-brain-cover'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book/approved-brain-cover
      - name: Import and verify the exact approved PNG
        env:
          COVER_DOWNLOAD: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-44d0-81f5-b672-514f79581639/raw?se=2026-11-13T16%3A03%3A34Z&sp=r&sv=2026-06-06&sr=b&scid=53c52d4d-f264-5543-936f-dc05c777cf43&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T13%3A58%3A47Z&ske=2026-11-14T13%3A58%3A47Z&sks=b&skv=2026-06-06&sig=8VCCFEDoBMn2N6a2QZMEyszWw/2J/ZXggpAVFtweO3g%3D'
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import struct
          from urllib.request import urlopen
          with urlopen(os.environ['COVER_DOWNLOAD'], timeout=60) as response:
              image = response.read(5000001)
          expected = 'ea88877832e61c007549c727b09fac01139749b0642e1d8ad6ed053001cb5c18'
          assert hashlib.sha256(image).hexdigest() == expected, 'Approved image checksum mismatch'
          assert image[:8] == b'\x89PNG\r\n\x1a\n', 'Expected PNG'
          assert struct.unpack('>II', image[16:24]) == (1829, 860), 'Unexpected image dimensions'
          target = Path('assets/cover-brain-approved.png')
          target.write_bytes(image)
          page = Path('index.md')
          text = page.read_text(encoding='utf-8')
          old = '```{image} assets/cover.svg\n:alt: Stylized cover showing a mobile robot, spatial firing fields, and a neural navigation circuit'
          new = '```{image} assets/cover-brain-approved.png\n:alt: Introduction to Neuromorphic Embodied AI by Hongyu An, 2026, with the author-approved glowing neural-network brain on a dark teal grid background'
          assert text.count(old) == 1, 'Homepage cover reference differs from expected source'
          page.write_text(text.replace(old, new), encoding='utf-8')
          print('Verified and staged approved cover:', len(image), 'bytes; SHA256:', expected)
          PY
      - name: Commit only the cover and homepage reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/cover-brain-approved.png index.md
          git commit -m 'Replace homepage robot cover with exact approved neural-brain PNG'
          git push origin HEAD:book/approved-brain-cover
