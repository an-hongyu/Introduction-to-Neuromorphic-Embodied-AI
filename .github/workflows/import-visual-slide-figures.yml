name: Import original visual lecture figures
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/import-visual-slide-figures.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'book/visual-perception-original-slide-figures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book/visual-perception-original-slide-figures
      - name: Match captions to the original figure labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('chapters/06-visual-perception.md')
          text = p.read_text()
          old = 'The source figure shows a color scene and several channel views, including the hue, saturation, and value views identified in its original caption. Compare the structures retained by each representation.'
          new = 'The source figure shows a color scene alongside hue, saturation, monochrome intensity, and two additional chromatic-channel views labeled in the original caption. Compare the structures retained by each representation.'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          m = Path('assets/visual-perception-slides/manifest.json')
          data = json.loads(m.read_text())
          for row in data['figures']:
              if row['name'] == 'color-space-image-channels':
                  row['caption'] = row['caption'].replace(old, new)
              if row['name'] == 'ccd-cmos-readout':
                  row['credit_on_slide_or_image'] = 'Embedded Figure 2.24 and its original credit text are retained. The source metadata is not independently expanded.'
          m.write_text(json.dumps(data, indent=2, ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters/06-visual-perception.md assets/visual-perception-slides/manifest.json
          git commit -m "Keep illustration captions and provenance faithful to the supplied figure labels"
          git push origin HEAD:book/visual-perception-original-slide-figures
