name: Apply requested chapter removal
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/remove-bridge-once.yml']
permissions:
  contents: write
jobs:
  edit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'book/remove-ann-snn-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book/remove-ann-snn-bridge
      - name: Remove the selected chapter and update its references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          ROOT = Path.cwd()
          def edit(path, transform):
              p = ROOT/path
              before = p.read_text(encoding='utf-8')
              after = transform(before)
              if after != before:
                  p.write_text(after, encoding='utf-8')
                  print('UPDATED', path)
          removed = 'chapters/05-neural-encoding.md'
          p = ROOT/removed
          assert p.is_file(), 'Expected chapter source is missing'
          assert 'Neural Encoding and the ANN' in p.read_text(encoding='utf-8')
          protected = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                       for folder in ('assets', 'notebooks')
                       for p in (ROOT/folder).rglob('*') if p.is_file()}
          p.unlink()
          print('DELETED', removed)
          edit('myst.yml', lambda s: s.replace('    - file: chapters/05-neural-encoding.md\n', '').replace('  - title: Encoding, Sensing, and Embodied Learning', '  - title: Sensing and Embodied Learning'))
          def remove_solutions(s):
              start = s.index('## Chapter 5 ')
              stop = s.index('## Chapter 6 ', start)
              return (s[:start]+s[stop:]).replace('Part II: Neural Encoding and Embodied Robotics', 'Part II: Sensors and Embodied Robotics')
          edit('chapters/solutions-embodied.md', remove_solutions)
          for path in ('index.md', 'chapters/course-reading-map.md', 'chapters/roadmap.md'):
              edit(path, lambda s: ''.join(line for line in s.splitlines(keepends=True) if '05-neural-encoding.md' not in line))
          edit('README.md', lambda s: s.replace('5. Neural Encoding and the ANN\u2013SNN Bridge.\n', ''))
          chapters = {6: '06-visual-perception.md', 7: '07-inertial-sensing.md', 8: '08-lidar-encoding.md', 9: '09-nengo-ros-gazebo.md', 10: '10-associative-learning-robot.md'}
          for old, name in chapters.items():
              edit('chapters/'+name, lambda s, old=old: re.sub(r'^(#{1,6}\s+)'+str(old)+r'\.(\d+)', lambda m: m[1]+str(old-1)+'.'+m[2], s, flags=re.M))
          references = ['index.md', 'README.md', 'chapters/course-reading-map.md', 'chapters/roadmap.md', 'chapters/solutions-embodied.md', 'chapters/02-spatial-cells.md', 'chapters/04-hebbian-learning.md']+['chapters/'+v for v in chapters.values()]
          def chapter_numbers(s):
              s = re.sub(r'\bChapter (10|[6-9])\b', lambda m: 'Chapter '+str(int(m[1])-1), s)
              s = s.replace('Ten numbered chapters', 'Nine numbered chapters')
              return s.replace('Part II \u2014 Encoding and embodied learning', 'Part II \u2014 Sensing and embodied learning')
          for path in references:
              edit(path, chapter_numbers)
          for path in ('index.md', 'chapters/roadmap.md'):
              def linked_labels(s):
                  for old, name in chapters.items():
                      s = re.sub(r'\['+str(old)+r'\. ([^\]]+)\]\(((?:chapters/)?'+re.escape(name)+r')\)', lambda m: '['+str(old-1)+'. '+m[1]+']('+m[2]+')', s)
                      s = re.sub(r'^'+str(old)+r'\. (\[[^\]]+\]\('+re.escape(name)+r'\))', lambda m: str(old-1)+'. '+m[1], s, flags=re.M)
                  return s
              edit(path, linked_labels)
          def readme_list(s):
              a, b = s.split('## Current textbook structure', 1)
              b, c = b.split('Original figures,', 1)
              b = re.sub(r'^(10|[6-9])\. ', lambda m: str(int(m[1])-1)+'. ', b, flags=re.M)
              return a+'## Current textbook structure'+b+'Original figures,'+c
          edit('README.md', readme_list)
          def answers(s):
              s = re.sub(r'^(## Chapter [5-9] [^\d\n]+)(10|[6-9])\.(\d+)', lambda m: m[1]+str(int(m[2])-1)+'.'+m[3], s, flags=re.M)
              for old, name in chapters.items():
                  s = re.sub(re.escape(name)+r'#'+str(old)+r'(\d+)-exercises', lambda m: name+'#'+str(old-1)+m[1]+'-exercises', s)
              return s
          edit('chapters/solutions-embodied.md', answers)
          for old, name in chapters.items():
              def explicit_exercise(s, old=old):
                  return re.sub(r'^(## '+str(old-1)+r'\.(\d+) Exercises)[ \t]*$', lambda m: '('+str(old-1)+m[2]+'-exercises)=\n\n'+m[1], s, flags=re.M)
              edit('chapters/'+name, explicit_exercise)
          def tests(s):
              s = s.replace("'Place Cell', 'Neural Encoding', 'Visual Perception'", "'Place Cell', 'Visual Perception'")
              return s + '''\n# Regression checks for the author-requested removal of the ANN-SNN bridge.\nassert not (root.parent.parent / 'chapters/05-neural-encoding.md').exists()\nassert not (root / 'chapters/neural-encoding/index.html').exists()\nassert 'Neural Encoding and the ANN' not in all_html\nfor number, title in [(5, 'Visual Perception'), (6, 'Inertial Sensing'),\n                      (7, 'LiDAR'), (8, 'Nengo'), (9, 'Capstone')]:\n    assert f'Chapter {number} \\u00b7 {title}' in all_html\nprint('Removed chapter regression passed; retained chapters are numbered 1 through 9.')\n'''
          edit('tests/check_build.py', tests)
          edit('AGENTS.md', lambda s: s+'\n- The former Neural Encoding/ANN-SNN bridge chapter was removed at the author\'s request. The retained sensor and robotics chapters are numbered 5-9 (Visual Perception, Inertial Sensing, LiDAR, Nengo/ROS/Gazebo, Capstone). Keep their existing source filenames and published URLs; keep the eight computational laboratories.\n')
          assert not (ROOT/removed).exists()
          for path in [ROOT/'index.md', ROOT/'myst.yml', ROOT/'README.md', *(ROOT/'chapters').glob('*.md')]:
              assert '05-neural-encoding.md' not in path.read_text(encoding='utf-8'), f'Stale chapter link in {path}'
          for old, name in chapters.items():
              source = (ROOT/'chapters'/name).read_text(encoding='utf-8')
              assert 'title: "Chapter '+str(old-1)+' ' in source
              assert not re.search(r'^#{1,6}\s+'+str(old)+r'\.', source, re.M)
          for path, digest in protected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, f'Protected asset changed: {path}'
          print('PASS: chapter removed, references updated, five chapters renumbered, notebooks and images unchanged.')
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md myst.yml index.md chapters tests/check_build.py
          git commit -m 'Remove ANN-SNN bridge chapter and renumber remaining chapters 5-9'
          git push origin HEAD:book/remove-ann-snn-bridge
      - name: Save changed text and generator sources for review
        uses: actions/upload-artifact@v4
        with:
          name: chapter-removal-source-review
          path: |
            chapters
            tools
            tests
            index.md
            myst.yml
            README.md
            AGENTS.md
          retention-days: 1
