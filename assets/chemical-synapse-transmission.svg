<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title id="title">Chemical synaptic transmission between neurons A and B</title>
<desc id="desc">Six steps link an axonal action potential to calcium entry, vesicle fusion, transmitter diffusion, receptor activation, and integration by the receiving neuron. Clearance and recovery are shown separately.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#68869a"/></marker></defs>
<rect width="1100" height="640" rx="18" fill="#f4f8fb"/>
<g font-family="Arial,sans-serif" fill="#18364c">
<text x="30" y="36" font-size="25" font-weight="bold">From neuron A to neuron B: chemical synaptic transmission</text>
<text x="30" y="62" font-size="16">Presynaptic electrical activity → chemical communication → postsynaptic response</text>
<rect x="35" y="90" width="320" height="155" rx="12" fill="#e2edf5" stroke="#aec4d1" stroke-width="1.5"/><text x="52" y="123" font-size="21" font-weight="bold">1. Action potential in A</text><text x="52" y="158" font-size="17">A generates its own spike.</text><text x="52" y="183" font-size="17">Axonal conduction brings</text><text x="52" y="208" font-size="17">depolarization to the terminal.</text><rect x="390" y="90" width="320" height="155" rx="12" fill="#e2edf5" stroke="#aec4d1" stroke-width="1.5"/><text x="407" y="123" font-size="21" font-weight="bold">2. Calcium entry</text><text x="407" y="158" font-size="17">Voltage-gated calcium</text><text x="407" y="183" font-size="17">channels open. Ca2+ enters</text><text x="407" y="208" font-size="17">the presynaptic terminal.</text><rect x="745" y="90" width="320" height="155" rx="12" fill="#e2edf5" stroke="#aec4d1" stroke-width="1.5"/><text x="762" y="123" font-size="21" font-weight="bold">3. Vesicle fusion</text><text x="762" y="158" font-size="17">Local calcium activates</text><text x="762" y="183" font-size="17">release machinery. Vesicles</text><text x="762" y="208" font-size="17">fuse with the membrane.</text><rect x="745" y="305" width="320" height="155" rx="12" fill="#f8ebd6" stroke="#aec4d1" stroke-width="1.5"/><text x="762" y="338" font-size="21" font-weight="bold">4. Transmitter release</text><text x="762" y="373" font-size="17">Vesicular contents enter</text><text x="762" y="398" font-size="17">the cleft and diffuse toward</text><text x="762" y="423" font-size="17">postsynaptic receptors.</text><rect x="390" y="305" width="320" height="155" rx="12" fill="#e1efe6" stroke="#aec4d1" stroke-width="1.5"/><text x="407" y="338" font-size="21" font-weight="bold">5. Receptor response</text><text x="407" y="373" font-size="17">Ionotropic channels or</text><text x="407" y="398" font-size="17">metabotropic pathways</text><text x="407" y="423" font-size="17">change the state of B.</text><rect x="35" y="305" width="320" height="155" rx="12" fill="#e1efe6" stroke="#aec4d1" stroke-width="1.5"/><text x="52" y="338" font-size="21" font-weight="bold">6. Integration in B</text><text x="52" y="373" font-size="17">B combines this response</text><text x="52" y="398" font-size="17">with its other inputs and state.</text><text x="52" y="423" font-size="17">B may or may not fire.</text><g stroke="#68869a" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M358 166H380"/><path d="M713 166H735"/><path d="M905 249V292"/>
<path d="M741 380H720"/><path d="M386 380H365"/></g>
<rect x="35" y="500" width="1030" height="106" rx="12" fill="white" stroke="#c4d5df"/>
<text x="55" y="531" font-size="20" font-weight="bold">Clearance and recovery shape the next response</text>
<text x="55" y="560" font-size="17">Transport, enzymatic inactivation, and diffusion terminate transmitter action in synapse-dependent ways.</text>
<text x="55" y="586" font-size="17">Vesicle recycling and release dynamics also influence subsequent communication.</text>
</g></svg>