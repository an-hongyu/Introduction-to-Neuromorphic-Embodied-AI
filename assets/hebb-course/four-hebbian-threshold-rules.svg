<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="705" viewBox="0 0 1180 705" role="img" aria-labelledby="t d"><title id="t">Four threshold-based Hebbian potentiation and depression rules</title><desc id="d">Four panels compare a high–high LTP-only rule, a rule that weakens both mismatched high–low activity states, a rule that weakens only high-presynaptic/low-postsynaptic states, and a rule that weakens low-presynaptic/high-postsynaptic states.</desc><rect width="1180" height="705" rx="20" fill="#f8fafc"/><text x="42" y="43" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="27" fill="#152c47">Four illustrative rate-threshold learning rules</text><g font-family="Arial,Helvetica,sans-serif" font-size="14"><rect x="43" y="59" width="20" height="17" rx="3" fill="#d7f2e5" stroke="#92cfb5"/><text x="72" y="72" fill="#3b556a">LTP · strengthen</text><rect x="220" y="59" width="20" height="17" rx="3" fill="#fce1df" stroke="#eab2af"/><text x="249" y="72" fill="#3b556a">LTD · weaken</text><rect x="373" y="59" width="20" height="17" rx="3" fill="#ffffff" stroke="#aab9c8"/><text x="402" y="72" fill="#3b556a">No update</text><text x="812" y="72" fill="#64748b">Threshold rₜ on both firing-rate axes</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="34" y="105" width="538" height="263" rx="15" fill="#ffffff" stroke="#d9e2ea"/><text x="59" y="136" font-weight="700" font-size="20" fill="#19354d">Rule 1</text><text x="159" y="136" font-weight="400" font-size="16" fill="#496075">Potentiation only</text><rect x="62" y="155" width="91.5" height="91.5" fill="#f8fafc"/><text x="107.75" y="205.75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a3adba">—</text><rect x="153.5" y="155" width="91.5" height="91.5" fill="#d7f2e5"/><text x="199.25" y="205.75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#14583b">LTP</text><rect x="62" y="246.5" width="91.5" height="91.5" fill="#f8fafc"/><text x="107.75" y="297.25" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a3adba">—</text><rect x="153.5" y="246.5" width="91.5" height="91.5" fill="#f8fafc"/><text x="199.25" y="297.25" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a3adba">—</text><rect x="62" y="155" width="183" height="183" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M 153.5 155 V 338 M 62 246.5 H 245" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="153.5" y="361" font-size="12.5" text-anchor="middle" fill="#475569">presynaptic rate →</text><text x="54" y="163" font-size="13" text-anchor="end" fill="#475569">high</text><text x="54" y="334" font-size="13" text-anchor="end" fill="#475569">low</text><text x="153.5" y="348" font-size="12" text-anchor="middle" fill="#64748b">rₜ</text><text x="280" y="213" font-size="16" fill="#19354d">Coactive high–high pair</text><text x="280" y="237" font-size="16" fill="#19354d">strengthens the connection</text><text x="280" y="304" font-size="13.5" fill="#64748b">Vertical axis:</text><text x="280" y="324" font-size="13.5" fill="#64748b">postsynaptic rate ↑</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="600" y="105" width="538" height="263" rx="15" fill="#ffffff" stroke="#d9e2ea"/><text x="625" y="136" font-weight="700" font-size="20" fill="#19354d">Rule 2</text><text x="725" y="136" font-weight="400" font-size="16" fill="#496075">Two-sided depression</text><rect x="628" y="155" width="91.5" height="91.5" fill="#fce1df"/><text x="673.75" y="205.75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#9d3b38">LTD</text><rect x="719.5" y="155" width="91.5" height="91.5" fill="#d7f2e5"/><text x="765.25" y="205.75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#14583b">LTP</text><rect x="628" y="246.5" width="91.5" height="91.5" fill="#f8fafc"/><text x="673.75" y="297.25" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a3adba">—</text><rect x="719.5" y="246.5" width="91.5" height="91.5" fill="#fce1df"/><text x="765.25" y="297.25" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#9d3b38">LTD</text><rect x="628" y="155" width="183" height="183" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M 719.5 155 V 338 M 628 246.5 H 811" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="719.5" y="361" font-size="12.5" text-anchor="middle" fill="#475569">presynaptic rate →</text><text x="620" y="163" font-size="13" text-anchor="end" fill="#475569">high</text><text x="620" y="334" font-size="13" text-anchor="end" fill="#475569">low</text><text x="719.5" y="348" font-size="12" text-anchor="middle" fill="#64748b">rₜ</text><text x="846" y="213" font-size="16" fill="#19354d">Both mismatched-rate</text><text x="846" y="237" font-size="16" fill="#19354d">quadrants depress</text><text x="846" y="304" font-size="13.5" fill="#64748b">Vertical axis:</text><text x="846" y="324" font-size="13.5" fill="#64748b">postsynaptic rate ↑</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="34" y="389" width="538" height="263" rx="15" fill="#ffffff" stroke="#d9e2ea"/><text x="59" y="420" font-weight="700" font-size="20" fill="#19354d">Rule 3</text><text x="159" y="420" font-weight="400" font-size="16" fill="#496075">Presynaptic-only LTD</text><rect x="62" y="439" width="91.5" height="91.5" fill="#f8fafc"/><text x="107.75" y="489.75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a3adba">—</text><rect x="153.5" y="439" width="91.5" height="91.5" fill="#d7f2e5"/><text x="199.25" y="489.75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#14583b">LTP</text><rect x="62" y="530.5" width="91.5" height="91.5" fill="#f8fafc"/><text x="107.75" y="581.25" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a3adba">—</text><rect x="153.5" y="530.5" width="91.5" height="91.5" fill="#fce1df"/><text x="199.25" y="581.25" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#9d3b38">LTD</text><rect x="62" y="439" width="183" height="183" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M 153.5 439 V 622 M 62 530.5 H 245" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="153.5" y="645" font-size="12.5" text-anchor="middle" fill="#475569">presynaptic rate →</text><text x="54" y="447" font-size="13" text-anchor="end" fill="#475569">high</text><text x="54" y="618" font-size="13" text-anchor="end" fill="#475569">low</text><text x="153.5" y="632" font-size="12" text-anchor="middle" fill="#64748b">rₜ</text><text x="280" y="497" font-size="16" fill="#19354d">Pre high / post low</text><text x="280" y="521" font-size="16" fill="#19354d">selectively depresses</text><text x="280" y="588" font-size="13.5" fill="#64748b">Vertical axis:</text><text x="280" y="608" font-size="13.5" fill="#64748b">postsynaptic rate ↑</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="600" y="389" width="538" height="263" rx="15" fill="#ffffff" stroke="#d9e2ea"/><text x="625" y="420" font-weight="700" font-size="20" fill="#19354d">Rule 4</text><text x="725" y="420" font-weight="400" font-size="16" fill="#496075">Postsynaptic-only LTD</text><rect x="628" y="439" width="91.5" height="91.5" fill="#fce1df"/><text x="673.75" y="489.75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#9d3b38">LTD</text><rect x="719.5" y="439" width="91.5" height="91.5" fill="#d7f2e5"/><text x="765.25" y="489.75" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#14583b">LTP</text><rect x="628" y="530.5" width="91.5" height="91.5" fill="#f8fafc"/><text x="673.75" y="581.25" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a3adba">—</text><rect x="719.5" y="530.5" width="91.5" height="91.5" fill="#f8fafc"/><text x="765.25" y="581.25" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#a3adba">—</text><rect x="628" y="439" width="183" height="183" fill="none" stroke="#64748b" stroke-width="1.5"/><path d="M 719.5 439 V 622 M 628 530.5 H 811" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="719.5" y="645" font-size="12.5" text-anchor="middle" fill="#475569">presynaptic rate →</text><text x="620" y="447" font-size="13" text-anchor="end" fill="#475569">high</text><text x="620" y="618" font-size="13" text-anchor="end" fill="#475569">low</text><text x="719.5" y="632" font-size="12" text-anchor="middle" fill="#64748b">rₜ</text><text x="846" y="497" font-size="16" fill="#19354d">Pre low / post high</text><text x="846" y="521" font-size="16" fill="#19354d">selectively depresses</text><text x="846" y="588" font-size="13.5" fill="#64748b">Vertical axis:</text><text x="846" y="608" font-size="13.5" fill="#64748b">postsynaptic rate ↑</text></g><text x="42" y="683" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#65778a">Adapted and redrawn from H. An, Hebbian’s Rule lecture, slides 24–28. These are alternative model rules, not universal biological laws.</text></svg>