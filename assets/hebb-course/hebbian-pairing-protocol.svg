<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="635" viewBox="0 0 1180 635" role="img" aria-labelledby="t d">
<title id="t">Hebbian pairing and changes in postsynaptic response</title>
<desc id="d">Three teaching stages from lecture slide 21: initially one presynaptic spike evokes a small subthreshold EPSP, coactive presynaptic and postsynaptic spike trains form the pairing episode, and the same presynaptic test spike subsequently evokes a larger EPSP.</desc>
<rect width="1180" height="635" rx="20" fill="#f8fafc"/>
<text x="40" y="49" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#12243b">Hebbian pairing: from coactivity to stronger transmission</text>
<text x="41" y="78" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#52647a">Same presynaptic test stimulus before and after an illustrative pairing protocol</text>
