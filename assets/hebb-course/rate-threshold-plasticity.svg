<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="500" viewBox="0 0 1110 500" role="img" aria-labelledby="t d"><title id="t">Continuous rate-dependent Hebbian plasticity threshold</title><desc id="d">A model curve proportional to presynaptic firing rate times postsynaptic firing rate times postsynaptic rate minus the threshold. At positive presynaptic firing rate, the synaptic update is negative below 15 Hz and positive above 15 Hz.</desc>
