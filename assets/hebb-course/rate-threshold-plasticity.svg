<text x="42" y="48" font-size="29" font-weight="700" fill="#152c47">A continuous rate-dependent potentiation / depression rule</text>
<text x="42" y="77" font-size="16" fill="#65788b">For fixed positive presynaptic activity, the postsynaptic rate controls the sign</text>
