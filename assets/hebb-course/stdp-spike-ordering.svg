<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="652" viewBox="0 0 1120 652" role="img" aria-labelledby="t d"><title id="t">Pre-post spike ordering and the spike-timing-dependent plasticity window</title><desc id="d">Left: presynaptic spike arrives before postsynaptic spike, giving positive delta t and potentiation. Right: postsynaptic spike arrives first, giving negative delta t and depression. Lower plot shows a learning window with negative update at negative delta t and positive update at positive delta t, using delta t equals post time minus pre time.</desc>
<rect width="1120" height="652" rx="22" fill="#f8fafc"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="40" y="44" font-size="28" font-weight="700" fill="#172c47">Spike-timing-dependent plasticity (STDP)</text>
<text x="40" y="73" font-size="17" fill="#5b6c81">The sign follows the explicit convention Δt = tpost − tpre</text>
<rect x="40" y="98" width="504" height="215" rx="16" fill="#ffffff" stroke="#dce5ed"/>
<rect x="574" y="98" width="504" height="215" rx="16" fill="#ffffff" stroke="#dce5ed"/>
<text x="64" y="132" font-size="21" font-weight="700" fill="#14694d">Pre before post → LTP</text>
<text x="598" y="132" font-size="21" font-weight="700" fill="#a34745">Post before pre → LTD</text>
