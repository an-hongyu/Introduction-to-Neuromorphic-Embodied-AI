<g stroke="#7895ad" stroke-width="1.6"><line x1="255" y1="268" x2="376" y2="268"/><line x1="255" y1="261" x2="255" y2="275"/><line x1="376" y1="261" x2="376" y2="275"/><line x1="782" y1="268" x2="903" y2="268"/><line x1="782" y1="261" x2="782" y2="275"/><line x1="903" y1="261" x2="903" y2="275"/></g>
