<circle cx="237" cy="295" r="22" fill="#CBF0E9" stroke="#4F9B92" stroke-width="3"/>
<path d="M299 294Q410 289 540 298L575 301" stroke="#1F938D" stroke-width="12" stroke-linecap="round" fill="none"/>
