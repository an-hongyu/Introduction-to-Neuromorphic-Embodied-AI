<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 682" role="img" aria-labelledby="nTitle nDesc">
<title id="nTitle">Chemical signaling from neuron A to neuron B</title>
<desc id="nDesc">Two distinct neurons connected by an axon terminal and dendrite. A magnified synapse shows calcium influx, synaptic vesicle fusion, transmitter diffusion across the cleft, and postsynaptic receptor activation. Six steps lead to an optional postsynaptic spike, not automatic copying.</desc>
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8AD8C5"/><stop offset="1" stop-color="#158278"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D1B5E6"/><stop offset="1" stop-color="#8360AB"/></linearGradient>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" stroke="#447D89" stroke-width="2" fill="none"/></marker>
</defs>
<rect width="1280" height="682" rx="20" fill="white" stroke="#DCE7E9" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="35" y="52" font-size="30" font-weight="700" fill="#173C51">How one neuron influences another</text>
<text x="35" y="83" font-size="18" fill="#647C89">Electrical signal in A → chemical messenger at the synapse → graded response in B</text>
<rect x="33" y="107" width="342" height="43" rx="21" fill="#E3F5F0"/><text x="204" y="135" text-anchor="middle" font-size="21" fill="#176B64" font-weight="700">Presynaptic neuron A</text>
<rect x="890" y="107" width="344" height="43" rx="21" fill="#F0E8F6"/><text x="1060" y="135" text-anchor="middle" font-size="21" fill="#67498B" font-weight="700">Postsynaptic neuron B</text>
<!-- A dendrites and cell -->
