circle cx="737" cy="315" r="4.2" fill="#D86F89" stroke="#B7536A" stroke-width="1"/><circle cx="759" cy="315" r="4.2" fill="#D86F89" stroke="#B7536A" stroke-width="1"/><path d="M802 255h9v17h-9" stroke="#906FB6" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M802 284h9v17h-9" stroke="#906FB6" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M802 313h9v17h-9" stroke="#906FB6" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M576 247h-23v-12" stroke="#1F938D" stroke-width="3" fill="none"/><text x="576" y="398" font-size="15" fill="#1F938D" font-weight="700">Ca²⁺ influx</text>
<path d="M605 375v13h-28" stroke="#1F938D" stroke-width="2" fill="none"/>
<g fill="#D4A043" stroke="#B5883D" stroke-width="1.3"><circle cx="573" cy="268" r="5"/><circle cx="587" cy="284" r="5"/><circle cx="571" cy="305" r="5"/></g>
<text x="659" y="398" font-size="15" fill="#D86F89" font-weight="700">Transmitter</text>
<text x="805" y="398" font-size="15" fill="#906FB6" font-weight="700">Receptors</text>
<text x="691" y="426" font-size="14" fill="#647C89">Synaptic cleft</text>
<path d="M735 378v30" stroke="#647C89" stroke-width="2"/>
<g font-size="17" font-weight="600" fill="#173C51"><text x="58" y="451">A generates an action potential</text><text x="924" y="451">B receives a synaptic potential</text></g>
<path d="M361 468h882" stroke="#8AA9AF" stroke-width="2.5" marker-end="url(#arr)" fill="none"/>
<g><rect x="29" y="513" width="195" height="126" rx="13" fill="#F1F8F8" stroke="#DCE7E9" stroke-width="2"/>
<circle cx="57" cy="544" r="17" fill="#1F938D"/><text x="57" y="550" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">1</text>
<text x="44" y="584" font-size="17" font-weight="700" fill="#173C51">Spike arrives</text>
<text x="44" y="609" font-size="13.7" fill="#647C89">Axon of neuron A</text><rect x="237" y="513" width="195" height="126" rx="13" fill="#F7F2F9" stroke="#DCE7E9" stroke-width="2"/>
<circle cx="265" cy="544" r="17" fill="#1F938D"/><text x="265" y="550" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">2</text>
<text x="252" y="584" font-size="17" font-weight="700" fill="#173C51">Ca²⁺ enters</text>
<text x="252" y="609" font-size="13.7" fill="#647C89">Voltage-gated channels</text><rect x="445" y="513" width="195" height="126" rx="13" fill="#F1F8F8" stroke="#DCE7E9" stroke-width="2"/>
<circle cx="473" cy="544" r="17" fill="#1F938D"/><text x="473" y="550" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">3</text>
<text x="460" y="584" font-size="17" font-weight="700" fill="#173C51">Vesicle fusion</text>
<text x="460" y="609" font-size="13.7" fill="#647C89">Transmitter is released</text><rect x="653" y="513" width="195" height="126" rx="13" fill="#F7F2F9" stroke="#DCE7E9" stroke-width="2"/>
<circle cx="681" cy="544" r="17" fill="#906FB6"/><text x="681" y="550" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">4</text>
<text x="668" y="584" font-size="17" font-weight="700" fill="#173C51">Across the cleft</text>
<text x="668" y="609" font-size="13.7" fill="#647C89">Transmitter diffuses</text><rect x="861" y="513" width="195" height="126" rx="13" fill="#F1F8F8" stroke="#DCE7E9" stroke-width="2"/>
<circle cx="889" cy="544" r="17" fill="#906FB6"/><text x="889" y="550" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">5</text>
<text x="876" y="584" font-size="17" font-weight="700" fill="#173C51">Receptors activate</text>
<text x="876" y="609" font-size="13.7" fill="#647C89">Postsynaptic current</text><rect x="1069" y="513" width="195" height="126" rx="13" fill="#F7F2F9" stroke="#DCE7E9" stroke-width="2"/>
<circle cx="1097" cy="544" r="17" fill="#906FB6"/><text x="1097" y="550" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">6</text>
<text x="1084" y="584" font-size="17" font-weight="700" fill="#173C51">Neuron B integrates</text>
<text x="1084" y="609" font-size="13.7" fill="#647C89">Spike is not guaranteed</text></g>
<text x="37" y="663" font-size="15" fill="#647C89">Original teaching schematic, not to scale. Excitation or inhibition depends on the postsynaptic receptors and ionic driving forces.</text>
</g></svg>