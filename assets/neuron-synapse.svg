<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 750" role="img" aria-labelledby="title desc">
<title id="title">Neuron anatomy and chemical synapse</title>
<desc id="desc">A pink neuron with labeled dendrites, nucleus, soma, axon initial segment, myelinated axon and axon terminals, with a circular inset showing a chemical synapse between presynaptic and postsynaptic membranes.</desc>
<defs>
<linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9D8ED"/><stop offset=".52" stop-color="#E9A5CF"/><stop offset="1" stop-color="#C881B9"/></linearGradient>
<radialGradient id="soma"><stop stop-color="#F6D8EA"/><stop offset=".72" stop-color="#D99CC7"/><stop offset="1" stop-color="#B775AB"/></radialGradient>
<radialGradient id="nucleus"><stop stop-color="#A06B9E"/><stop offset="1" stop-color="#634368"/></radialGradient>
<linearGradient id="myelin" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#49CFC4"/><stop offset=".6" stop-color="#009E9B"/><stop offset="1" stop-color="#087A80"/></linearGradient>
<linearGradient id="post" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#A7D5E9"/><stop offset="1" stop-color="#5A9ABF"/></linearGradient>
<clipPath id="inset"><circle cx="1100" cy="205" r="164"/></clipPath>
</defs>
