<circle cx="670" cy="162" r="8" fill="#3E7FBB" opacity=".75"/>
<g font-size="16" fill="#173C51">
<text x="80" y="201">Muscle stretch</text>
<text x="287" y="136">Trigger zone</text>
<text x="685" y="137">Sensory axon</text>
<text x="886" y="202">Axon terminal</text>
<text x="1074" y="138">Target neuron</text>
<text x="1074" y="161">receives transmitter</text>
</g>
<g stroke="#DCE6EA" stroke-width="2"><path d="M245 232v430M496 232v430M744 232v430M987 232v430"/></g>
