<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 718" role="img" aria-labelledby="ttl dsc">
<title id="ttl">How stimulus strength and duration become neural spikes and transmitter release</title>
<desc id="dsc">An original five-column didactic figure. A sensory stimulus creates a graded receptor potential; the trigger zone generates all-or-none spikes; the axon conducts them; terminal transmitter release depends on patterns of action potentials. Rows compare weaker, stronger, and longer stimulation.</desc>
<rect width="1320" height="718" rx="20" fill="#fff" stroke="#E0E9EB" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="42" y="52" font-size="28" font-weight="700" fill="#173C51">From a sensory stimulus to synaptic output</text>
<text x="42" y="80" font-size="18" fill="#627987">The membrane response is graded; spike amplitude is not. Information is expressed in spike rate, timing, and count.</text>
<rect x="46" y="106" width="1226" height="107" rx="12" fill="#F2F7F8" stroke="#DCE6EA" stroke-width="2"/>
<g stroke-linecap="round" fill="none">
