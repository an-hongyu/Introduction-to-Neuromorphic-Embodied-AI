<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Communication from a presynaptic neuron to a postsynaptic neuron</title>
<desc id="desc">Two neurons connected at a chemical synapse. The presynaptic neuron at left has teal dendrites, a soma and axon leading to a terminal; the postsynaptic neuron at right has lavender dendrites and soma. An enlarged inset shows vesicles, transmitter molecules, a synaptic cleft and receptors. Diagram is schematic and not to scale.</desc>
<defs>
<linearGradient id="pre" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70BCAF"/><stop offset="1" stop-color="#277F79"/></linearGradient>
<linearGradient id="post" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C2A4D0"/><stop offset="1" stop-color="#8661A8"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FAFCFB"/><stop offset="1" stop-color="#EFF6F3"/></linearGradient>
<marker id="signal-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 9 5 0 10" fill="none" stroke="#357E75" stroke-width="2"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="638" rx="20" fill="#FFFFFF" stroke="#E0E8E7" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="55" y="49" font-size="28" font-weight="700" fill="#233B40">Chemical synaptic communication</text>
<text x="55" y="78" font-size="17" fill="#617678">A signal travels along one axon and influences a second neuron through a specialized contact.</text>
<rect x="70" y="105" width="295" height="47" rx="23" fill="#E3F3EF"/>
<text x="218" y="136" text-anchor="middle" font-size="21" font-weight="700" fill="#246F69">Presynaptic neuron</text>
<rect x="835" y="105" width="295" height="47" rx="23" fill="#F0E8F6"/>
<text x="983" y="136" text-anchor="middle" font-size="21" font-weight="700" fill="#6E4B91">Postsynaptic neuron</text>
<!-- Presynaptic dendritic arbor -->
<g fill="none" stroke="#3B9D92" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
<path d="M278 300 209 250 167 205 113 196 M167 205 148 152 M209 250 149 271 103 258 M149 271 120 303"/>
<path d="M260 311 188 351 151 405 107 419 M151 405 166 460 M188 351 130 351 89 370"/>
<path d="M285 283 274 230 299 190 293 158 M274 230 241 203 226 169"/>
</g>
<ellipse cx="293" cy="307" rx="69" ry="58" fill="url(#pre)" stroke="#227C73" stroke-width="3"/>
<circle cx="295" cy="307" r="25" fill="#C1EEE3" stroke="#448F87" stroke-width="3"/>
<circle cx="299" cy="306" r="12" fill="#6AABA0"/>
<!-- Axon and terminal -->
<path d="M356 305 C435 286 475 295 532 304 C575 311 606 324 635 322" stroke="#348C83" stroke-width="12" fill="none" stroke-linecap="round"/>
<g fill="#B1DAD0" stroke="#4D9A8F" stroke-width="2">
<rect x="397" y="284" width="48" height="31" rx="13" transform="rotate(-5 421 299)"/>
<rect x="462" y="282" width="48" height="33" rx="13"/>
<rect x="529" y="292" width="49" height="32" rx="13" transform="rotate(7 552 308)"/>
</g>
<path d="M628 321 Q657 290 683 285 M628 321 Q660 316 690 317 M628 321 Q656 350 681 365" stroke="#348C83" stroke-width="7" fill="none" stroke-linecap="round"/>
<g fill="#D88393" stroke="#BD6378" stroke-width="2"><circle cx="688" cy="283" r="13"/><circle cx="694" cy="317" r="13"/><circle cx="685" cy="366" r="13"/></g>
