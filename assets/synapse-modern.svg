<rect x="385" y="477" width="182" height="33" rx="13" fill="#D8EEE7" stroke="#469184" stroke-width="2"/>
<rect x="385" y="549" width="182" height="20" rx="9" fill="#E7DCEF" stroke="#997DB1" stroke-width="2"/>
<g fill="#D1768A" stroke="#B45C75" stroke-width="1.5"><circle cx="416" cy="492" r="8"/><circle cx="454" cy="492" r="8"/><circle cx="490" cy="492" r="8"/><circle cx="526" cy="492" r="8"/></g>
<g fill="#D1768A"><circle cx="430" cy="521" r="4"/><circle cx="459" cy="529" r="4"/><circle cx="481" cy="519" r="4"/><circle cx="512" cy="533" r="4"/></g>
<g stroke="#8661A8" stroke-width="5" stroke-linecap="round"><path d="M429 547v25M460 547v25M491 547v25M520 547v25"/></g>
<text x="135" y="507" font-size="17" fill="#315D58">Vesicles release</text><text x="135" y="529" font-size="17" fill="#315D58">neurotransmitter</text>
<path d="M305 516H376" stroke="#357E75" stroke-width="2.5" marker-end="url(#signal-arrow)"/>
<text x="605" y="499" font-size="17" fill="#5D5368">Presynaptic terminal</text>
<text x="605" y="528" font-size="17" fill="#5D5368">Synaptic cleft</text>
<text x="605" y="558" font-size="17" fill="#5D5368">Postsynaptic receptors</text>
<path d="M586 489H574 M586 521H544 M586 554H535" fill="none" stroke="#A4B8B6" stroke-width="2"/>
<text x="842" y="494" font-size="16" fill="#556A6F">Electrical activity</text>
<text x="842" y="518" font-size="16" fill="#556A6F">→ chemical signal</text>
<text x="842" y="542" font-size="16" fill="#556A6F">→ receptor response</text>
<text x="842" y="566" font-size="15" fill="#718488">Schematic; not to scale</text>
</g></svg>