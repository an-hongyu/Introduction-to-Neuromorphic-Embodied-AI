<path d="M942 311 863 274 825 242 774 239 M825 242 808 207 M863 274 807 284 764 299"/>
<path d="M934 323 869 365 817 396 784 441 M817 396 821 450 M869 365 839 339 799 337"/>
<path d="M948 288 961 225 991 190 993 157 M961 225 934 196 924 169"/>
