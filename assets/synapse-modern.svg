<circle cx="953" cy="307" r="24" fill="#E7D9EF" stroke="#9475AD" stroke-width="3"/><circle cx="953" cy="305" r="11" fill="#AA8CC3"/>
<path d="M1015 307 C1065 313 1087 320 1135 294" stroke="#9672AF" stroke-width="11" fill="none" stroke-linecap="round"/>
<!-- synaptic connection marker -->
<ellipse cx="721" cy="316" rx="35" ry="61" fill="#F6E7EB" fill-opacity=".7" stroke="#C5768A" stroke-width="2" stroke-dasharray="5 5"/>
<text x="719" y="222" text-anchor="middle" fill="#A84F6A" font-size="22" font-weight="700">Synapse</text>
